[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "shadowmire"
version = "2.0.0.dev0"
description = "A lightweight PyPI mirror synchronizer"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0 OR AFL-3.0"
license-files = ["LICENSE", "LICENSE.AFL"]
authors = [{ name = "taoky" }]
dependencies = [
    "click==8.1.7",
    "requests==2.32.4",
    "tqdm==4.66.4",
]

[dependency-groups]
utils = [
    "packaging==25.0",
]
dev = [
    { include-group = "utils" },
    "pytest~=9.0.0",
    "ruff~=0.16.3",
    "ty~=0.0.72",
    "types-requests~=2.32.0",
    "types-tqdm~=4.66.0",
]

[project.urls]
Homepage = "https://github.com/taoky/shadowmire"
Repository = "https://github.com/taoky/shadowmire"

[project.scripts]
shadowmire = "shadowmire.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/shadowmire"]

# Keep uv.lock independent of developer-specific user configuration. Command-line
# index options can still override this when intentionally using another index.
[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
ignore = ["E722", "E731"]
