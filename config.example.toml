[options]
# repo = "/example/path"

# Note that by default sync_packages is false
sync_packages = true
# Enable when first applying package-file rules to an existing mirror, after a
# release/file filter change, or when local state needs repair. See
# docs/PARTIAL.md for normal automatic reconciliation.
# reconcile_package_files = true
# Print the computed plan without applying it or finalizing the mirror.
# dry_run = true
# shadowmire_upstream = "http://example.com/pypi/web/"
# use_pypi_index = true

# Ordered package selection rules. An action includes metadata and files, keeps
# metadata only, or excludes the project. The first match wins; unmatched items
# are included.
# Do not use package_filters together with the legacy include/exclude.
package_filters = [
    # Always hide a problematic project and remove its package files:
    # { action = "exclude", pattern = "^problematic-project$" },
    # Only mirror package files for selected projects while keeping full metadata:
    # { action = "include", pattern = "^requests$" },
    # { action = "metadata-only", pattern = ".*" },
]

# Legacy package selection rules (see docs/FILTER.md for their semantics):
# exclude = ["^django"]
# include = ["^django-ninja$"]

prerelease_exclude = [
    ".+"
]
excluded_wheel_filename = []
skip_yanked = false
# skip_old_packages_days = 1095
filter_metadata = true
least_releases_to_keep = 0
