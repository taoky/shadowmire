[options]
# repo = "/example/path"

# Note that by default sync_packages is false
sync_packages = true
# shadowmire_upstream = "http://example.com/pypi/web/"
# use_pypi_index = true

# Ordered package selection rules. The first match wins; unmatched packages are
# included. Do not use package_filters together with the legacy include/exclude.
package_filters = [
    # { action = "include", pattern = "^django-ninja$" },
    # { action = "exclude", pattern = "^django" },
]

# Legacy package selection rules (see docs/FILTER.md for their semantics):
# exclude = ["^django"]
# include = ["^django-ninja$"]

prerelease_exclude = [
    ".+"
]
excluded_wheel_filename = []
skip_yanked = false
# skip_old_packages_days = 1095
filter_metadata = true
least_releases_to_keep = 0
